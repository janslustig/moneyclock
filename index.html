<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gehaltszähler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  --bg:#f3f1ec; --surface:#fff; --ink:#1d2320; --muted:#6b7570; --line:#d9d6cd; --accent:#1f7a4d; --accent-ink:#fff; --stop:#b4432f;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121715; --surface:#1b221f; --ink:#eef2ef; --muted:#93a099; --line:#2c3632; --accent:#4cc489; --accent-ink:#0c1a13; --stop:#e57a64; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#121715; --surface:#1b221f; --ink:#eef2ef; --muted:#93a099; --line:#2c3632; --accent:#4cc489; --accent-ink:#0c1a13; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:30rem;padding:1.5rem 1.25rem 2.5rem;display:flex;flex-direction:column;gap:1.5rem}
h1{font-size:1.1rem;font-weight:600;margin:0;color:var(--muted)}
.counter{padding:2rem 0 .5rem}
.amount{font-size:clamp(2.2rem,11vw,3.8rem);font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;word-break:break-all}
.sub{margin-top:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sub b{color:var(--ink);font-weight:600}
#time{display:inline-block;min-width:7.5em}
.btns{display:flex;gap:.75rem}
button{font:inherit;font-weight:600;border-radius:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:1rem;cursor:pointer;min-height:3.25rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#toggle{flex:1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.1rem}
#toggle.running{background:var(--stop);border-color:var(--stop);color:#fff}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;padding-top:1.25rem;border-top:1px solid var(--line)}
label{display:flex;flex-direction:column;gap:.35rem;font-size:.9rem;color:var(--muted)}
input{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:.7rem .8rem;width:100%}
.hint{font-size:.85rem;color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <h1>Gehaltszähler</h1>
  <section class="counter" aria-live="off">
    <div class="amount" id="amount">0,00 €</div>
    <div class="sub">Pro Stunde <b id="hourly">–</b> · pro Minute <b id="minute">–</b></div>
    <div class="sub">Arbeitszeit <b id="time">00:00:00</b></div>
  </section>
  <div class="btns">
    <button id="toggle" type="button">Arbeit starten</button>
    <button id="reset" type="button">Zurücksetzen</button>
  </div>
  <section class="fields">
    <label>Monatsgehalt (€)<input id="salary" type="number" inputmode="decimal" min="0" step="any" value="3000"></label>
    <label>Arbeitsstunden pro Monat<input id="hours" type="number" inputmode="decimal" min="0" step="any" value="160"></label>
  </section>
  <p class="hint">Die Eingaben werden in diesem Browser gespeichert. Der Stundenlohn ergibt sich aus Gehalt geteilt durch Stunden.</p>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var salary=$('salary'),hours=$('hours'),btn=$('toggle');
  var eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
  var eurFine=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:3,maximumFractionDigits:3});
  var eurLive=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:4,maximumFractionDigits:4});
  var accumMs=0,startTs=null,timer=null;

  function load(){
    try{
      var s=JSON.parse(localStorage.getItem('gehaltszaehler')||'null');
      if(s){salary.value=s.salary;hours.value=s.hours;accumMs=s.accumMs||0;
        if(s.startTs){startTs=s.startTs;run();}}
    }catch(e){}
  }
  function save(){
    try{localStorage.setItem('gehaltszaehler',JSON.stringify({salary:salary.value,hours:hours.value,accumMs:accumMs,startTs:startTs}));}catch(e){}
  }
  function rate(){ // Euro pro Sekunde
    var s=parseFloat(salary.value),h=parseFloat(hours.value);
    return (s>0&&h>0)?s/h/3600:0;
  }
  function pad(n){return String(n).padStart(2,'0')}
  function render(){
    var ms=accumMs+(startTs?Date.now()-startTs:0);
    var r=rate();
    $('amount').textContent=eurLive.format(ms/1000*r);
    $('hourly').textContent=r?eur.format(r*3600):'–';
    $('minute').textContent=r?eurFine.format(r*60):'–';
    var t=Math.floor(ms/1000),cs=Math.floor(ms%1000/10);
    $('time').textContent=pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60)+','+pad(cs);
  }
  function loop(){render();if(startTs)timer=requestAnimationFrame(loop);}
  function run(){
    btn.textContent='Pause';btn.classList.add('running');
    cancelAnimationFrame(timer);loop();
  }
  function pause(){
    accumMs+=Date.now()-startTs;startTs=null;
    cancelAnimationFrame(timer);btn.textContent='Weiter arbeiten';btn.classList.remove('running');render();
  }
  btn.addEventListener('click',function(){
    if(startTs){pause();}else{startTs=Date.now();run();}
    save();
  });
  $('reset').addEventListener('click',function(){
    cancelAnimationFrame(timer);accumMs=0;startTs=null;
    btn.textContent='Arbeit starten';btn.classList.remove('running');render();save();
  });
  [salary,hours].forEach(function(el){el.addEventListener('input',function(){render();save();});});
  load();render();
})();
</script>
</body>
</html>
