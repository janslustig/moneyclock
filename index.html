<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gehaltszähler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Lilita+One&family=Press+Start+2P&display=swap">
<style>
:root{
  box-sizing:border-box;
  --bg1:#3a5483; --bg2:#2d4571; --card:#fcf4e2; --edge:#e3d6b8; --tag:#f8e3b0; --tag-edge:#d9c28a;
  --ink:#5a4a36; --ink-soft:#8b7a62; --text:#fcf4e2; --muted:#c3d0e6;
  --mint:#bfe8d0; --mint-edge:#79b794; --mint-ink:#2f5d47;
  --rose:#f2bcae; --rose-edge:#d98f7e; --rose-ink:#7a3d30;
  --head:"Lilita One","Fredoka",system-ui,sans-serif;
  --body:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#27375a; --bg2:#1e2b49; --muted:#a9b8d3;}
}
:root[data-theme="dark"]{--bg1:#27375a; --bg2:#1e2b49; --muted:#a9b8d3;}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg2)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:flex;justify-content:center;background:linear-gradient(var(--bg1),var(--bg2)) fixed;color:var(--text);font-family:var(--body)}
body::before{content:"";position:fixed;inset:14px;border:2px dashed rgba(252,244,226,.14);border-radius:28px;pointer-events:none}
main{width:100%;max-width:34rem;padding:2.25rem 1.5rem 3rem;display:flex;flex-direction:column;gap:1.75rem;position:relative}
h1{font-family:var(--head);font-weight:400;font-size:clamp(2rem,9vw,2.75rem);line-height:1.05;margin:0;letter-spacing:.01em}
.cap{margin:0 0 .9rem;color:var(--muted);font-size:.95rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem}
#snd{--d:3px;--sh:var(--tag-edge);display:flex;align-items:center;justify-content:center;flex:none;width:2.75rem;height:2.75rem;min-height:2.75rem;padding:0;font-size:1.2rem;line-height:1;background:var(--tag);color:var(--ink);border-radius:12px}
.tag{display:inline-block;max-width:100%;background:var(--tag);color:var(--ink);padding:.5rem 1.1rem .6rem;border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.14),0 12px 24px rgba(0,0,0,.18)}
.amount{display:block;font-weight:600;font-size:clamp(2rem,10.5vw,3.4rem);letter-spacing:.02em;line-height:1.1;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";white-space:nowrap}
#amt span{display:inline-block;text-align:center}
#amt .d{width:.64em}
#amt .s{width:.3em}
.cur{margin-left:.2em}
.meta{margin-top:1.4rem;display:flex;flex-wrap:wrap;gap:.4rem 1.25rem;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.meta b{color:var(--text);font-weight:500}
#time{display:inline-block;min-width:7.5em}
.btns{display:flex;gap:.9rem}
button{--d:5px;font-family:var(--body);font-weight:600;font-size:1.1rem;border:0;border-radius:14px;padding:.95rem 1rem;min-height:3.4rem;cursor:pointer;box-shadow:0 var(--d) 0 var(--sh,var(--edge));transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(calc(var(--d) - 1px));box-shadow:0 1px 0 var(--sh,var(--edge))}
button:focus-visible,input:focus-visible{outline:3px solid var(--tag);outline-offset:3px}
#toggle{flex:1.4;background:var(--mint);color:var(--mint-ink);--sh:var(--mint-edge)}
#toggle::before{content:"\25B6\00a0";font-size:.8em}
#toggle.running{background:var(--rose);color:var(--rose-ink);--sh:var(--rose-edge)}
#toggle.running::before{content:"\275A\275A\00a0";font-size:.7em}
#reset{flex:1;background:var(--card);color:var(--ink);--sh:var(--edge)}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:1.25rem 1.25rem 2rem}
.stats{display:flex;flex-direction:column;gap:.85rem;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/18px 100%}
.mhead{display:flex;align-items:center;justify-content:space-between}
.mhead h2{margin:0;font-size:1.15rem;font-weight:600}
.mhead button{--d:3px;--sh:var(--tag-edge);width:2.5rem;min-height:2.5rem;height:2.5rem;padding:0;font-size:1.4rem;line-height:1;background:var(--tag);color:var(--ink);border-radius:12px}
.mhead button:disabled{opacity:.4;cursor:default}
.mnums{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.k{display:block;font-size:.85rem;color:var(--ink-soft)}
.mnums b{font-size:1.55rem;font-weight:600;font-variant-numeric:tabular-nums}
.track{height:14px;border-radius:999px;background:var(--rose);overflow:hidden}
#mbar{height:100%;width:0;background:var(--mint-edge);border-radius:999px}
.chart{display:flex;align-items:flex-end;gap:3px;height:5rem}
.bar{flex:1;background:var(--edge);border-radius:4px 4px 0 0;min-height:2px}
.bar.on{background:var(--mint-edge);opacity:.6}
.bar.today{opacity:1;background:#5aa07a}
.axis{display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-soft)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.card .hint{color:var(--ink-soft)}
.link{background:none;border:0;box-shadow:none;color:var(--ink-soft);text-decoration:underline;padding:0;min-height:0;font-weight:400;font-size:.85rem;align-self:flex-start;border-radius:0}
.link:active{transform:none;box-shadow:none}
.pigcard{display:flex;flex-direction:column;gap:.5rem;padding-bottom:1.25rem}
.pigtop{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}
.pigcard .k{font-family:"Press Start 2P",var(--body);font-size:.55rem;line-height:1.4;margin-bottom:.45rem}
.pigtop b{font-family:"Press Start 2P",var(--body);font-size:1rem;font-weight:400}
.pigside{text-align:right}
#pig{display:block;align-self:center;width:192px;height:auto;margin:calc(var(--px,4px) + .5rem) 0;image-rendering:crisp-edges;image-rendering:pixelated;cursor:pointer;box-shadow:0 calc(-1*var(--px,4px)) 0 #1b2740,0 var(--px,4px) 0 #1b2740,calc(-1*var(--px,4px)) 0 0 #1b2740,var(--px,4px) 0 0 #1b2740}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
label{display:flex;flex-direction:column;gap:.4rem;font-size:.9rem;color:var(--muted)}
input{font:inherit;font-size:1.1rem;font-weight:500;color:var(--ink);background:var(--card);border:0;border-bottom:4px solid var(--edge);border-radius:12px;padding:.7rem .9rem;width:100%}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Gehaltszähler</h1>
    <button id="snd" type="button" aria-label="Ton ausschalten"></button>
  </header>
  <section class="counter" aria-live="off">
    <p class="cap">Verdient seit dem letzten Zurücksetzen</p>
    <div class="tag"><span class="amount" id="amount"><span id="amt">0,0000</span><span class="cur">€</span></span></div>
    <div class="meta">
      <span>Pro Stunde <b id="hourly">–</b></span>
      <span>Pro Minute <b id="minute">–</b></span>
      <span>Arbeitszeit <b id="time">00:00:00,00</b></span>
    </div>
  </section>
  <div class="btns">
    <button id="toggle" type="button">Arbeit starten</button>
    <button id="reset" type="button">Zurücksetzen</button>
  </div>
  <section class="pigcard card" aria-label="Sparschwein">
    <div class="pigtop">
      <div><span class="k">Heute gespart</span><b id="pigeur">0,00 €</b></div>
      <div class="pigside"><span class="k">Tagesziel</span><b id="pigpct">0 %</b></div>
    </div>
    <canvas id="pig" width="128" height="80" role="img" aria-label="Pixelspiel: gesammeltes Bargeld"></canvas>
    <p class="hint" id="pigtxt"></p>
  </section>
  <section class="stats card" aria-label="Monatsstatistik">
    <div class="mhead">
      <button id="mprev" type="button" aria-label="Voriger Monat">‹</button>
      <h2 id="mlabel">Monat</h2>
      <button id="mnext" type="button" aria-label="Nächster Monat">›</button>
    </div>
    <div class="mnums">
      <div><span class="k">Gearbeitet</span><b id="mwork">0:00 Std.</b></div>
      <div><span class="k">Verdient</span><b id="meur">0,00 €</b></div>
    </div>
    <div class="track"><div id="mbar"></div></div>
    <p class="hint" id="mpct"></p>
    <div class="chart" id="chart" role="img" aria-label="Arbeitszeit pro Tag"></div>
    <div class="axis"><span>1.</span><span id="mlast"></span></div>
    <p class="hint" id="mavg"></p>
    <button id="mclear" type="button" class="link">Statistik löschen</button>
  </section>
  <section class="fields">
    <label>Monatsgehalt (€)<input id="salary" type="number" inputmode="decimal" min="0" step="any" value="3000"></label>
    <label>Arbeitsstunden pro Monat<input id="hours" type="number" inputmode="decimal" min="0" step="any" value="160"></label>
  </section>
  <p class="hint">Die Eingaben werden in diesem Browser gespeichert.</p>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var salary=$('salary'),hours=$('hours'),btn=$('toggle');
  var eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
  var eurFine=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:3,maximumFractionDigits:3});
  var nf4=new Intl.NumberFormat('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4});
  function setDigits(el,str){
    if(el.children.length!==str.length){el.innerHTML='';for(var j=0;j<str.length;j++)el.appendChild(document.createElement('span'));}
    for(var i=0;i<str.length;i++){
      var ch=str.charAt(i),sp=el.children[i],cl=/\d/.test(ch)?'d':'s';
      if(sp.className!==cl)sp.className=cl;
      if(sp.textContent!==ch)sp.textContent=ch;
    }
  }
  var accumMs=0,startTs=null,lc=null,log={},rateNow=0,lastSave=0,lastStats=0,viewY=new Date().getFullYear(),viewM=new Date().getMonth();

  /* ---------- Zähler ---------- */
  var sndOn=true,actx=null;
  try{sndOn=localStorage.getItem('gehaltszaehler-sound')!=='0';}catch(e){}
  function tone(f1,f2,dur,type,vol,when){
    var t=actx.currentTime+(when||0),o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02);
  }
  var nbuf=null;
  function click(p,v){
    var t=actx.currentTime;
    p*=1+(Math.random()-.5)*.08;
    if(!nbuf){nbuf=actx.createBuffer(1,Math.floor(actx.sampleRate*.04),actx.sampleRate);var d=nbuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*.006));}
    var s=actx.createBufferSource(),lp=actx.createBiquadFilter(),g=actx.createGain();
    s.buffer=nbuf;lp.type='lowpass';lp.frequency.value=3600*p;g.gain.value=.5*v;
    s.connect(lp);lp.connect(g);g.connect(actx.destination);s.start(t);
    var o=actx.createOscillator(),og=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(420*p,t);o.frequency.exponentialRampToValueAtTime(240*p,t+.03);
    og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(.3*v,t+.003);og.gain.exponentialRampToValueAtTime(.0001,t+.045);
    o.connect(og);og.connect(actx.destination);o.start(t);o.stop(t+.06);
    var q=actx.createOscillator(),qg=actx.createGain();
    q.type='sine';q.frequency.setValueAtTime(1300*p,t);q.frequency.exponentialRampToValueAtTime(1800*p,t+.03);
    qg.gain.setValueAtTime(.0001,t);qg.gain.exponentialRampToValueAtTime(.1*v,t+.004);qg.gain.exponentialRampToValueAtTime(.0001,t+.06);
    q.connect(qg);qg.connect(actx.destination);q.start(t);q.stop(t+.07);
  }
  function snd(k){
    if(!sndOn)return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      actx=actx||new AC();
      if(actx.state==='suspended')actx.resume();
      if(k==='coin'){tone(988,988,.07,'square',.05);tone(1319,1319,.16,'square',.05,.07);return;}
      click(k==='start'?1.15:k==='pause'?.9:k==='reset'?.75:1.4,k==='tick'?.55:1);
    }catch(e){}
  }
  function sndUi(){var b=$('snd'),sp='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/>';b.innerHTML=sp+(sndOn?'<path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/>':'<path d="M16 9.5l5 5M21 9.5l-5 5"/>')+'</svg>';b.setAttribute('aria-label',sndOn?'Ton ausschalten':'Ton einschalten');}
  $('snd').addEventListener('click',function(){sndOn=!sndOn;try{localStorage.setItem('gehaltszaehler-sound',sndOn?'1':'0');}catch(e){}sndUi();snd('tick');});
  sndUi();
  var timer=null;
  function load(){
    try{
      var s=JSON.parse(localStorage.getItem('gehaltszaehler')||'null');
      if(s){salary.value=s.salary;hours.value=s.hours;accumMs=s.accumMs||0;lc=s.lc||null;
        if(s.startTs){startTs=s.startTs;}}
      log=JSON.parse(localStorage.getItem('gehaltszaehler-log')||'{}')||{};
    }catch(e){}
    rateNow=rate();
    if(startTs){if(!lc)lc=startTs;commit(Date.now());run();}
  }
  function save(){
    try{localStorage.setItem('gehaltszaehler',JSON.stringify({salary:salary.value,hours:hours.value,accumMs:accumMs,startTs:startTs,lc:lc}));localStorage.setItem('gehaltszaehler-log',JSON.stringify(log));}catch(e){}
  }
  function rate(){
    var s=parseFloat(salary.value),h=parseFloat(hours.value);
    return (s>0&&h>0)?s/h/3600:0;
  }
  function pad(n){return String(n).padStart(2,'0')}
  function dkey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function commit(now){
    if(!startTs)return;
    if(lc===null||lc<startTs)lc=startTs;
    var t=lc;
    while(t<now){
      var d=new Date(t),end=Math.min(now,new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime()),k=dkey(t),e=log[k]||(log[k]={ms:0,eur:0});
      e.ms+=end-t;e.eur+=(end-t)/1000*rateNow;t=end;
    }
    lc=now;
  }
  /* ---------- Pixel-Bargeld mit Physik ---------- */
  var PW=128,PH=80,GY=76,GR=320,SUB=3;
  var DEN=[1,2,5,10,20,50,100,200,500];
  var DIM={1:[8,8],2:[10,10],5:[14,9],10:[15,9],20:[16,9],50:[17,9],100:[18,9],200:[19,9],500:[20,9]};
  var PAL={5:['#a2e3ae','#5fae72'],10:['#92dc9f','#559f69'],20:['#7ccf8c','#4f9e63'],50:['#6cc47e','#468f5a'],100:['#5db872','#3f8452'],200:['#50ac66','#387648'],500:['#43a05c','#306a40']};
  var FONT=['111101101101111','010110010010111','111001111100111','111001111001111','101101111001001','111100111001111','111100111101111','111001001001001','111101111101111','111101111001111'];
  var STARS=[[10,8],[34,16],[60,6],[88,12],[112,7],[20,34],[104,30],[120,22],[72,26]];
  var pcv=$('pig'),pcx=pcv.getContext('2d'),img=pcx.createImageData(PW,PH),buf=new Uint32Array(img.data.buffer),BG=new Uint32Array(PW*PH);
  var bodies=[],spawnQ=[],spawnCd=0,sparks=[],evts=[],dropped=null,lastPhase=-1,pTimer=null,lastT=0,acc=0,lastSnd=0,SPR={};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function col(h){var n=parseInt(h.slice(1),16);return ((255<<24)|((n&255)<<16)|(n&65280)|(n>>16))>>>0;}
  (function(){
    var y,x,c;
    for(y=0;y<PH;y++){c=col(y<46?'#2d4571':y<76?'#35507e':y===76?'#c9bb98':'#e3d6b8');for(x=0;x<PW;x++)BG[y*PW+x]=c;}
    for(x=0;x<PW;x+=9){BG[78*PW+x]=col('#c9bb98');BG[78*PW+x+1]=col('#c9bb98');}
    DEN.forEach(function(d){
      var w=DIM[d][0],h=DIM[d][1],px=new Uint32Array(w*h),OUT=col('#1b2740'),u,v,k,m,t,r,dd,dx,dy,cc;
      if(d<5){
        var ring=col(d===1?'#e8b83e':'#d9dde0'),inn=col(d===1?'#d9dde0':'#e8b83e'),mk=col('#fffbe8');r=w/2;
        for(v=0;v<h;v++)for(u=0;u<w;u++){
          dx=u+.5-r;dy=v+.5-r;dd=Math.sqrt(dx*dx+dy*dy);cc=0;
          if(dd<=r){cc=dd>r-1?OUT:dd>r-2?ring:inn;if(cc===ring&&v===1&&(u===r-1||u===r))cc=mk;}
          px[v*w+u]=cc;
        }
      }else{
        var base=col(PAL[d][0]),shade=col(PAL[d][1]),hl=col('#c4f2cd'),ink=col('#1f3b2a'),str=''+d,u0=Math.floor((w-(str.length*4-1))/2);
        for(v=0;v<h;v++)for(u=0;u<w;u++)px[v*w+u]=(u===0||v===0||u===w-1||v===h-1)?ink:base;
        for(u=1;u<w-1;u++){px[w+u]=hl;px[(h-2)*w+u]=shade;}
        for(k=0;k<str.length;k++){t=FONT[+str.charAt(k)];for(m=0;m<15;m++)if(t.charAt(m)==='1')px[(2+Math.floor(m/3))*w+u0+k*4+m%3]=ink;}
      }
      SPR[d]={w:w,h:h,px:px};
    });
  })();
  function mkBody(d,x,y){
    var w=DIM[d][0],h=DIM[d][1],coin=d<5,cs=[],r,n,i,span,m,I;
    if(coin){r=w/2;cs.push({x:0,y:0,r:r});}
    else{r=h/2;span=w-2*r;n=Math.ceil(span/r)+1;for(i=0;i<n;i++)cs.push({x:-span/2+span*i/(n-1),y:0,r:r});}
    m=coin?Math.PI*r*r:w*h;I=coin?m*r*r/2:m*(w*w+h*h)/12;
    return {d:d,x:x,y:y,a:Math.random()*6.28,vx:(Math.random()-.5)*30,vy:20,w:(Math.random()-.5)*4,im:1/m,ii:1/I,cs:cs,
      wx:new Array(cs.length),wy:new Array(cs.length),coin:coin,asleep:false,sl:0,touch:0,hit:0,
      e:coin?.35:.1,mu:coin?.35:.6,br:Math.sqrt(w*w+h*h)/2+1};
  }
  function spawn(d){bodies.push(mkBody(d,12+Math.random()*(PW-24),-10));}
  function mkc(A,B,nx,ny,pen,px,py,e,mu){return {A:A,B:B,nx:nx,ny:ny,pen:pen,px:px,py:py,e:e,mu:mu,jn:0,jt:0,bias:0};}
  function contacts(){
    var cl=[],i,j,p,q,A,B,cs,sn,dx,dy,r,ddx,ddy,d2,dd,rr,nx,ny,pen;
    for(i=0;i<bodies.length;i++){
      A=bodies[i];cs=Math.cos(A.a);sn=Math.sin(A.a);
      for(p=0;p<A.cs.length;p++){A.wx[p]=A.x+A.cs[p].x*cs-A.cs[p].y*sn;A.wy[p]=A.y+A.cs[p].x*sn+A.cs[p].y*cs;}
    }
    for(i=0;i<bodies.length;i++){
      A=bodies[i];
      if(!A.asleep){
        for(p=0;p<A.cs.length;p++){
          r=A.cs[p].r;
          if(A.wy[p]+r>GY)cl.push(mkc(null,A,0,-1,A.wy[p]+r-GY,A.wx[p],GY,.2,.5));
          if(A.wx[p]-r<0)cl.push(mkc(null,A,1,0,r-A.wx[p],0,A.wy[p],.2,.3));
          if(A.wx[p]+r>PW)cl.push(mkc(null,A,-1,0,A.wx[p]+r-PW,PW,A.wy[p],.2,.3));
        }
      }
      for(j=i+1;j<bodies.length;j++){
        B=bodies[j];
        if(A.asleep&&B.asleep)continue;
        dx=B.x-A.x;dy=B.y-A.y;r=A.br+B.br;
        if(dx*dx+dy*dy>r*r)continue;
        for(p=0;p<A.cs.length;p++)for(q=0;q<B.cs.length;q++){
          ddx=B.wx[q]-A.wx[p];ddy=B.wy[q]-A.wy[p];rr=A.cs[p].r+B.cs[q].r;d2=ddx*ddx+ddy*ddy;
          if(d2>=rr*rr)continue;
          dd=Math.sqrt(d2)||1e-6;nx=ddx/dd;ny=ddy/dd;pen=rr-dd;
          cl.push(mkc(A,B,nx,ny,pen,A.wx[p]+nx*(A.cs[p].r-pen/2),A.wy[p]+ny*(A.cs[p].r-pen/2),Math.min(A.e,B.e),Math.sqrt(A.mu*B.mu)));
        }
      }
    }
    return cl;
  }
  function prep(c){
    var A=c.A,B=c.B,rax=A?c.px-A.x:0,ray=A?c.py-A.y:0,rbx=c.px-B.x,rby=c.py-B.y,F=A&&B.asleep?A:B;
    var vn=(B.vx-B.w*rby-(A?A.vx-A.w*ray:0))*c.nx+(B.vy+B.w*rbx-(A?A.vy+A.w*rax:0))*c.ny;
    c.bias=vn<-15?-c.e*vn:0;
    B.touch=1;if(A)A.touch=1;
    if(vn<-35&&!F.hit){F.hit=1;evts.push(F);}
  }
  function solve(c){
    var A=c.A,B=c.B,aD=A&&!A.asleep,bD=!B.asleep,imA=aD?A.im:0,iiA=aD?A.ii:0,imB=bD?B.im:0,iiB=bD?B.ii:0;
    if(imA+imB===0)return;
    var rax=A?c.px-A.x:0,ray=A?c.py-A.y:0,rbx=c.px-B.x,rby=c.py-B.y,nx=c.nx,ny=c.ny;
    var rvx=B.vx-B.w*rby-(A?A.vx-A.w*ray:0),rvy=B.vy+B.w*rbx-(A?A.vy+A.w*rax:0);
    var rnA=rax*ny-ray*nx,rnB=rbx*ny-rby*nx,kn=imA+imB+rnA*rnA*iiA+rnB*rnB*iiB;
    var j=(c.bias-(rvx*nx+rvy*ny))/kn,old=c.jn,ix,iy;
    c.jn=Math.max(0,old+j);j=c.jn-old;ix=j*nx;iy=j*ny;
    if(aD){A.vx-=ix*imA;A.vy-=iy*imA;A.w-=(rax*iy-ray*ix)*iiA;}
    if(bD){B.vx+=ix*imB;B.vy+=iy*imB;B.w+=(rbx*iy-rby*ix)*iiB;}
    rvx=B.vx-B.w*rby-(A?A.vx-A.w*ray:0);rvy=B.vy+B.w*rbx-(A?A.vy+A.w*rax:0);
    var tx=-ny,ty=nx,rtA=rax*ty-ray*tx,rtB=rbx*ty-rby*tx,kt=imA+imB+rtA*rtA*iiA+rtB*rtB*iiB;
    var jt=-(rvx*tx+rvy*ty)/kt,oldt=c.jt,mx=c.mu*c.jn;
    c.jt=Math.max(-mx,Math.min(mx,oldt+jt));jt=c.jt-oldt;ix=jt*tx;iy=jt*ty;
    if(aD){A.vx-=ix*imA;A.vy-=iy*imA;A.w-=(rax*iy-ray*ix)*iiA;}
    if(bD){B.vx+=ix*imB;B.vy+=iy*imB;B.w+=(rbx*iy-rby*ix)*iiB;}
  }
  function correct(c){
    var A=c.A,B=c.B,aD=A&&!A.asleep,bD=!B.asleep,k=(aD?A.im:0)+(bD?B.im:0),cr;
    if(k===0)return;
    cr=Math.max(c.pen-.04,0)*.3/k;
    if(aD){A.x-=c.nx*cr*A.im;A.y-=c.ny*cr*A.im;}
    if(bD){B.x+=c.nx*cr*B.im;B.y+=c.ny*cr*B.im;}
  }
  function phys(dt){
    var h=dt/SUB,s,i,b,cl,it,sp;
    for(i=0;i<bodies.length;i++)bodies[i].touch=0;
    for(s=0;s<SUB;s++){
      for(i=0;i<bodies.length;i++){b=bodies[i];if(b.asleep)continue;b.vy+=GR*h;b.x+=b.vx*h;b.y+=b.vy*h;b.a+=b.w*h;}
      cl=contacts();
      for(i=0;i<cl.length;i++)prep(cl[i]);
      for(it=0;it<6;it++)for(i=0;i<cl.length;i++)solve(cl[i]);
      for(i=0;i<cl.length;i++)correct(cl[i]);
    }
    for(i=bodies.length-1;i>=0;i--){
      b=bodies[i];
      if(b.y>PH+30){bodies.splice(i,1);continue;}
      if(b.asleep)continue;
      if(b.touch){b.vx*=Math.pow(.6,dt);b.w*=Math.pow(.35,dt);}
      sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      if(b.touch&&sp<4&&Math.abs(b.w)<.8)b.sl++;else b.sl=0;
      if(b.sl>45){b.asleep=true;b.vx=0;b.vy=0;b.w=0;}
    }
  }
  function awake(){for(var i=0;i<bodies.length;i++)if(!bodies[i].asleep)return true;return false;}
  function shiftFor(goal){var f=goal/150,s=0;while(s<DEN.length-1&&DEN[s+1]<=f)s++;return s;}
  function stage(D,s){var u=DEN[s],i=D<5*u?0:D<10*u?1:D<30*u?2:3;return DEN[Math.min(DEN.length-1,s+i)];}
  function payout(E,s){var d;while(bodies.length+spawnQ.length<250&&E-dropped>=(d=stage(dropped,s))){spawnQ.push(d);dropped+=d;}}
  function ffwd(){
    var st=0,i;
    while(st<1800){
      if(spawnQ.length&&st%12===0)spawn(spawnQ.shift());
      phys(1/60);st++;
      if(!spawnQ.length&&!awake())break;
    }
    for(i=0;i<bodies.length;i++)bodies[i].hit=1;
    evts=[];
  }
  function burst(x,y,n){for(var k=0;k<n;k++)sparks.push({x:x,y:y,vx:(Math.random()-.5)*2.4,vy:-Math.random()*1.8-.3,life:12+Math.floor(Math.random()*8)});}
  var SP1=col('#f8e3b0'),SP2=col('#fcf4e2');
  function blit(b){
    var sp=SPR[b.d],w=sp.w,h=sp.h,cs=Math.cos(b.a),sn=Math.sin(b.a),R=Math.ceil(b.br)+1,x0=Math.floor(b.x)-R,y0=Math.floor(b.y)-R,px,py,dx,dy,u,v,c;
    for(py=y0;py<=y0+2*R;py++){
      if(py<0||py>=PH)continue;
      for(px=x0;px<=x0+2*R;px++){
        if(px<0||px>=PW)continue;
        dx=px+.5-b.x;dy=py+.5-b.y;
        u=Math.floor(dx*cs+dy*sn+w/2);v=Math.floor(-dx*sn+dy*cs+h/2);
        if(u<0||v<0||u>=w||v>=h)continue;
        c=sp.px[v*w+u];if(c)buf[py*PW+px]=c;
      }
    }
  }
  function drawPix(){
    var i,t=Date.now(),u,v,f;
    buf.set(BG);lastPhase=Math.floor(t/700);
    for(i=0;i<STARS.length;i++){if((Math.floor(t/700)+i)%4)buf[STARS[i][1]*PW+STARS[i][0]]=SP2;}
    for(i=0;i<bodies.length;i++)blit(bodies[i]);
    for(i=0;i<sparks.length;i++){
      f=sparks[i];u=Math.round(f.x);v=Math.round(f.y);
      if(u>=0&&v>=0&&u<PW&&v<PH)buf[v*PW+u]=f.life%2?SP1:SP2;
    }
    pcx.putImageData(img,0,0);
  }
  function pixLoop(){
    var now=performance.now(),dt=Math.min(.1,(now-lastT)/1000),n=0,i,b,d;
    lastT=now;acc+=dt;spawnCd-=dt;
    if(spawnQ.length&&spawnCd<=0){d=spawnQ.shift();spawn(d);spawnCd=.4;}
    while(acc>=1/60&&n<4){phys(1/60);acc-=1/60;n++;}
    if(n===4)acc=0;
    for(i=0;i<evts.length;i++){
      b=evts[i];burst(b.x,b.y+(b.coin?0:2),3);
      if(Date.now()-lastSnd>70){lastSnd=Date.now();snd(b.coin?'coin':'tick');}
    }
    evts=[];
    for(i=sparks.length-1;i>=0;i--){b=sparks[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.15;if(--b.life<=0)sparks.splice(i,1);}
    drawPix();
    pTimer=(spawnQ.length||awake()||sparks.length)?setTimeout(pixLoop,33):null;
  }
  function pixKick(){if(!pTimer){lastT=performance.now();acc=0;pixLoop();}}
  function fitPix(){
    var w=$('pigtxt').clientWidth||300,s=Math.max(2,Math.min(4,Math.floor((w-16)/PW)));
    pcv.style.width=(PW*s)+'px';pcv.style.setProperty('--px',s+'px');drawPix();
  }
  function renderPig(){
    var e=(log[dkey(Date.now())]||{eur:0}).eur,E=Math.floor(e+1e-9),goal=rate()*8*3600,s=shiftFor(goal),den=stage(dropped||0,s);
    $('pigeur').textContent=eur.format(e);
    $('pigpct').textContent=Math.round((goal>0?e/goal:0)*100)+' %';
    $('pigtxt').textContent=goal>0?'Aktuell fallen '+den+'-€-'+(den<5?'Münzen':'Scheine')+'. Tagesziel: '+eur.format(goal)+'.':'Trage Gehalt und Stunden ein, damit Bargeld fallen kann.';
    if(dropped===null||E<dropped){bodies=[];spawnQ=[];sparks=[];evts=[];dropped=0;payout(E,s);if(spawnQ.length)ffwd();}
    else{payout(E,s);if(reduce&&spawnQ.length)ffwd();}
    if(spawnQ.length||awake()||sparks.length)pixKick();
    else if(!pTimer&&lastPhase!==Math.floor(Date.now()/700))drawPix();
  }
  pcv.addEventListener('click',function(){
    for(var i=0;i<bodies.length;i++){var b=bodies[i];b.asleep=false;b.sl=0;b.vy=-45-Math.random()*35;b.vx=(Math.random()-.5)*40;b.w=(Math.random()-.5)*6;}
    pixKick();snd('tick');
  });
  var bars=[],barsFor='';
  function hm(ms){var m=Math.floor(ms/60000);return Math.floor(m/60)+':'+pad(m%60);}
  function hms(ms){var s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
  function renderStats(){
    var pre=viewY+'-'+pad(viewM+1)+'-',dim=new Date(viewY,viewM+1,0).getDate(),tot=0,eu=0,per=[],max=3600000,days=0,i,n=new Date();
    for(i=1;i<=dim;i++){var e=log[pre+pad(i)]||{ms:0,eur:0};per.push(e);tot+=e.ms;eu+=e.eur;if(e.ms>0)days++;if(e.ms>max)max=e.ms;}
    $('mlabel').textContent=new Date(viewY,viewM,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'});
    $('mwork').textContent=hms(tot)+' Std.';
    $('meur').textContent=eur.format(eu);
    var soll=parseFloat(hours.value)||0,pct=soll>0?tot/3600000/soll*100:0;
    $('mbar').style.width=Math.min(100,pct)+'%';
    $('mpct').textContent=soll>0?Math.round(pct)+' % der '+soll.toLocaleString('de-DE')+' Monatsstunden':'';
    $('mavg').textContent=days?'Ø '+hm(tot/days)+' Std. und '+eur.format(eu/days)+' pro Arbeitstag ('+days+' Tage)':'Noch keine gestoppte Zeit in diesem Monat.';
    $('mlast').textContent=dim+'.';
    if(barsFor!==pre){var box=$('chart');box.innerHTML='';bars=[];for(i=0;i<dim;i++){var el=document.createElement('div');box.appendChild(el);bars.push(el);}barsFor=pre;}
    for(i=0;i<dim;i++){
      var cur=viewY===n.getFullYear()&&viewM===n.getMonth()&&i+1===n.getDate();
      bars[i].style.height=Math.max(2,per[i].ms/max*100)+'%';
      bars[i].className='bar'+(per[i].ms>0?' on':'')+(cur?' today':'');
      var t=(i+1)+'.'+(viewM+1)+'.: '+hm(per[i].ms)+' Std., '+eur.format(per[i].eur);
      if(bars[i].title!==t)bars[i].title=t;
    }
    $('mnext').disabled=(viewY===n.getFullYear()&&viewM===n.getMonth());
    renderPig();
  }
  function showRate(){var r=rate();$('hourly').textContent=r?eur.format(r*3600):'–';$('minute').textContent=r?eurFine.format(r*60):'–';}
  function render(){
    var ms=accumMs+(startTs?Date.now()-startTs:0);
    var r=rate();
    setDigits($('amt'),nf4.format(ms/1000*r));
    var t=Math.floor(ms/1000),cs=Math.floor(ms%1000/10);
    $('time').textContent=pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60)+','+pad(cs);
  }
  function loop(){var now=Date.now();render();if(now-lastStats>200){lastStats=now;commit(now);renderStats();}if(now-lastSave>5000){lastSave=now;save();}if(startTs)timer=requestAnimationFrame(loop);}
  function run(){
    btn.textContent='Pause';btn.classList.add('running');
    cancelAnimationFrame(timer);loop();
  }
  function pause(){
    var n=Date.now();commit(n);accumMs+=n-startTs;startTs=null;lc=null;
    cancelAnimationFrame(timer);btn.textContent='Weiter arbeiten';btn.classList.remove('running');render();renderStats();save();
  }
  btn.addEventListener('click',function(){
    if(startTs){pause();snd('pause');}else{startTs=Date.now();lc=startTs;rateNow=rate();run();snd('start');}
    save();
  });
  $('reset').addEventListener('click',function(){
    snd('reset');commit(Date.now());cancelAnimationFrame(timer);accumMs=0;startTs=null;lc=null;
    btn.textContent='Arbeit starten';btn.classList.remove('running');render();renderStats();save();
  });
  [salary,hours].forEach(function(el){el.addEventListener('input',function(){commit(Date.now());rateNow=rate();showRate();render();renderStats();save();});});
  $('mprev').addEventListener('click',function(){snd('tick');viewM--;if(viewM<0){viewM=11;viewY--;}renderStats();});
  $('mnext').addEventListener('click',function(){snd('tick');viewM++;if(viewM>11){viewM=0;viewY++;}renderStats();});
  var clearArm=null;
  $('mclear').addEventListener('click',function(){
    var b=this;
    if(clearArm){clearTimeout(clearArm);clearArm=null;snd('reset');b.textContent='Statistik löschen';log={};save();renderStats();return;}
    snd('tick');
    b.textContent='Wirklich löschen? Nochmal tippen';
    clearArm=setTimeout(function(){clearArm=null;b.textContent='Statistik löschen';},4000);
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden){commit(Date.now());save();}});
  window.addEventListener('pagehide',function(){commit(Date.now());save();});
  fitPix();
  window.addEventListener('resize',fitPix);
  load();showRate();render();renderStats();
})();
</script>
